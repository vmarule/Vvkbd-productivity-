<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VVKBD Reset</title><style>body{font-family:system-ui;padding:24px;text-align:center}button{padding:14px 20px;border:0;border-radius:10px;background:#071a32;color:#fff;font-weight:800;font-size:16px}</style></head><body><h2>VVKBD Productivity</h2><p id="status">Tap the button to completely clear VVKBD data on this device.</p><button id="reset">RESET ALL DATA</button><script>document.getElementById('reset').onclick=async()=>{if(!confirm('Delete ALL VVKBD tasks, goals, sales data and local app data on this device?'))return;try{for(const k of Object.keys(localStorage))localStorage.removeItem(k);for(const k of Object.keys(sessionStorage))sessionStorage.removeItem(k);if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('status').textContent='All VVKBD local data has been cleared. Opening a fresh app...';setTimeout(()=>location.replace('./?fresh='+Date.now()),500)}catch(e){document.getElementById('status').textContent='Reset failed: '+e.message}}</script></body></html>
